# Compose cho môi trường triển khai (VPS).
#
# Mọi cấu hình nhạy cảm (chuỗi kết nối DB, Redis, VietQr, Telegram) đọc từ file
# .env đặt cạnh file này — KHÔNG hardcode vào đây vì file này được commit.
# Xem .env.example để biết danh sách biến cần khai báo.
services:
  app:
    image: ${APP_IMAGE:-tuanballboo/taprim:latest}
    container_name: taprim
    restart: always
    ports:
      - "${APP_PORT:-80}:8080"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      # Ảnh sản phẩm upload được ghi ra ngoài container để không mất khi deploy lại.
      - ${UPLOADS_HOST_PATH:-/var/taprim/images}:/app/wwwroot/uploads
    networks:
      - app_net

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app_net

volumes:
  redis-data:

networks:
  app_net:
    name: app_net
    driver: bridge
